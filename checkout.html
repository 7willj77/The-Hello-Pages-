<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout | The Hello Pages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html">
    <span class="logo-mark">H</span>
    <span class="logo-copy">
      <b>THE HELLO PAGES</b>
      <small>SAY HELLO. GET NOTICED.</small>
    </span>
  </a>
</header>

<main class="checkout-main">
  <div class="checkout-card">
    <p class="kicker">CHECKOUT</p>
    <h1>One last hello.</h1>

    <div id="order"></div>

    <button id="pay" class="button dark full">
      PAY NOW <span>→</span>
    </button>

    <p id="status" class="fine">
      Secure payment powered by Stripe.
    </p>
  </div>
</main>

<footer>
  <b>THE HELLO PAGES</b>
  <span>© 2026 The Hello Pages</span>
</footer>

<script>
const SUPABASE_URL = "https://wzlntrcvlcjkkudvwcbf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_UTzMeIRTWOr423PVn0o3JA_DNTsvPMM";

const pending = JSON.parse(
  localStorage.getItem("helloPagesPendingOrder") || "null"
);

const order = document.getElementById("order");
const pay = document.getElementById("pay");
const status = document.getElementById("status");

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function showResult(type) {
  if (type === "success") {
    const business = pending?.business || "your business";

    order.innerHTML = `
      <div class="success">✓</div>
      <p class="kicker">PAYMENT RECEIVED</p>
      <h2>Hello, ${safe(business)}!</h2>
      <p>
        Thank you. Your payment has been received and your advert is now
        being processed.
      </p>
      <p class="fine">
        We'll use the details you provided when you reserved your space.
      </p>
      <a class="button dark" href="index.html">BACK TO THE BOOK →</a>
    `;

    pay.style.display = "none";
    status.textContent = "Payment completed securely through Stripe.";

    localStorage.removeItem("helloPagesPendingOrder");
    return;
  }

  if (type === "cancelled") {
    status.textContent =
      "Payment was cancelled. Your reserved space remains available briefly while you decide.";

    pay.disabled = false;
    pay.innerHTML = 'RETURN TO PAYMENT <span>→</span>';
  }
}

if (!pending) {
  order.innerHTML = `
    <p>No pending advert.</p>
    <p><a href="advertise.html"><b>Choose some space.</b></a></p>
  `;

  pay.style.display = "none";
} else {
  const pricePerSquare =
    pending.squares.length
      ? pending.price / pending.squares.length
      : 0;

  order.innerHTML = `
    <div class="order">
      <small>PAGE ${safe(pending.page)}</small>
      <h3>${safe(pending.business)}</h3>
      <p>
        ${pending.squares.length}
        squares × £${pricePerSquare.toFixed(2)}
      </p>
      <strong>£${Number(pending.price).toFixed(2)}</strong>
    </div>
  `;
}

async function startPayment() {
  if (!pending) return;

  pay.disabled = true;
  pay.innerHTML = "CONNECTING TO STRIPE…";
  status.textContent = "Creating your secure payment session…";

  try {
    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/create-checkout`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
        },
        body: JSON.stringify({
          orderId: pending.orderId,
          advertId: pending.advertId
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.url) {
      console.error("Checkout error:", data);
      throw new Error(data.error || "Unable to create checkout session");
    }

    status.textContent = "Redirecting to secure Stripe Checkout…";
    window.location.href = data.url;

  } catch (error) {
    console.error("Hello Pages payment error:", error);

    pay.disabled = false;
    pay.innerHTML = 'PAY NOW <span>→</span>';

    status.textContent =
      "Sorry — we couldn't connect to secure payment. Please try again.";
  }
}

pay.addEventListener("click", startPayment);

const params = new URLSearchParams(window.location.search);
const paymentStatus = params.get("payment");

if (paymentStatus === "success" || paymentStatus === "cancelled") {
  showResult(paymentStatus);
}
</script>

</body>
</html>
